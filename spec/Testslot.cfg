\* Two runs, no symmetry, so the temporal property can be checked. Cap 4 (or 2), load cap 3 (or 5),
\* outside load 0 or 4: load 4 holds the whole queue under load cap 3, and holds only the bigger runs under 5.
SPECIFICATION Spec
CONSTANTS
    Runs = {r1, r2}
    CapLevels = {2, 4}
    LoadCapLevels = {3, 5}
    LoadLevels = {0, 4}
    MaxCpus = 4
    Reserve = 1
    IdleX = 2
    ShrinkAfter = 1
    Margin = 1
    Cgroup = TRUE
INVARIANTS
    TypeOK
    RunningHasMain
    AdmitWithinCap
    AfterStopNothingAlive
    SlotHeldWhileAlive
    CancelNotFailure
PROPERTIES
    Liveness
